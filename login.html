<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Pelanggan — Nikah</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #faf8f5; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); width: 100%; max-width: 400px; }
    h1 { font-family: 'Playfair Display', serif; color: #8b5a2b; text-align: center; margin-bottom: 8px; }
    p.sub { text-align: center; color: #6b6b6b; margin-bottom: 28px; font-size: 0.95rem; }
    label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9rem; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #8b5a2b; }
    button { width: 100%; padding: 14px; background: #8b5a2b; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #6b4423; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #fee; color: #c00; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: #8b5a2b; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Login Pelanggan</h1>
    <p class="sub">Masuk ke Dapur Undangan Anda</p>
    <div class="error" id="error"></div>
    <form id="form">
      <label>Username</label>
      <input type="text" id="username" required placeholder="contoh: tantri" autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      <button type="submit" id="btn">Masuk</button>
    </form>
    <div class="back"><a href="/">← Kembali ke beranda</a></div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Jika sudah login, langsung ke dapur
    if (Auth.isLoggedIn()) {
      const u = Auth.getUser();
      window.location.href = '/' + u.username + '/dapur';
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      const res = await API.login(username, password);
      if (res.success) {
        Auth.saveSession(res.token, res.username, res.package);
        window.location.href = '/' + res.username + '/dapur';
      } else {
        errEl.textContent = res.error || 'Login gagal';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
<script src="/js/password-toggle.js"></script>
</body>
</html>
